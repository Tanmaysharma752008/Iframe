<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    
    <style>
         
        .con{
            height: 100vh;
            border: 1px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .box{
            height: 80%;
            width: 80%;
            display: flex;
            box-shadow: 10px 10px 10px;
            border-radius: 20px;
            
        }
        .left,.center,.right{
           height: 100%;
        }
        .left{
            height: 100%;
            width: 2%;
            background-color: navy;
            border-radius: 30px;
        }
        .center{
            width: 63%;
            font-size: 80px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: navy;
            background-color: whitesmoke;
        }
        h1{
            margin-left: 20px;
        }

        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .right{
            width: 35%;
            box-shadow: 10px 10px 10px;
            border-bottom-right-radius: 20px;
            border-top-right-radius: 20px;
            border-bottom-left-radius: 20px;
        }
         .top{
            height: 30%;
         }
         .bottom{
            height: 70%;
         } 
         .bottom>h1{
             font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
             text-align: center;
         }
        .circle{  
            height: 150px;
            position: absolute;
            top: 17%;
            right: 20%;
            width: 150px;
            border: 3px solid white;
            border-radius:50%;
            
        }
       
        .top-in{
            height: 90%;
            background-color: navy;
            border-top-right-radius: 20px;
            border-top-left-radius: 20px;
        }
        img{
            height: 100%;
            width: 100%;
            border: 1px solid white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .button{
            height: 20%;    
            align-items: center;
            display: flex;
            justify-content: space-evenly;
        }
        .button1{
            border-radius: 20px;
            color: white;
            width: 40%;
            height: 180%;
            background-color: navy;
            text-align: center;
            line-height: 30px;

        }
        .icon{
            height: 90%;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
        }
        .fa-instagram{
            background: linear-gradient(purple,red,yellow,orange);
            color: transparent;
            background-clip: text;
        }
        .fa-facebook{
            color: blue;
        }
        .fa-github{
            color: blueviolet;
        }
        .fa-linkedin{
            color: blue;
        }
        .fa-behance{
            color: blue;
        }
        .fa-heart{
            color:red
        }
        

    
    </style>
</head>
<body>
   <div class="con">
        <div class="box">
            <div class="left"></div>
            <div class="center">
                <h1>Profile Card UI UX Design</h1>
            </div>
            <div class="right">
                 <div class="top">
                    <div class="top-in">
                        <div class="circle"><img src="1.PNG.png" alt="" height="100px">
                        </div>
                    </div>
                 <div class="bottom">
                         <h1>Website Developer </h1>
                         <h1>Dezyne École College </h1>
                         <h1>BCA 1st Year </h1>
                     <div class="icon">   
                         <i class="fa fa-brands fa-instagram fa-3x"></i>
                         <i class="fa fa-brands fa-facebook fa-3x " ></i>
                         <i class="fa fa-brands fa-github fa-3x" ></i>
                         <i class="fa fa-brands fa-linkedin fa-3x"></i>
                         <i class="fa fa-brands fa-behance fa-3x"></i>
                     </div>
                     <div class="button">
                        <div class="button1">Subscribe</div>
                        <div class="button1">Message</div>
                     </div>
                      <div class="icon">   
                         <i class="fa fa-solid fa-heart fa-2x"></i>100k
                        <i class="fa fa-solid fa-comment fa-2x"></i>83k
                          <i class="fa fa-solid fa-share fa-2x"></i>12.5k
                     </div>
                         
                 </div>
            </div>
         </div>
     </div>
     
</body>
</html>
